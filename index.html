<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WC2026 Álbum de Figuritas</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <span class="material-symbols-outlined">sports_soccer</span>
    <h1>WC2026 Figuritas</h1>
  </header>

  <!-- Pages -->
  <main>
    <div id="page-dashboard" class="page active page-content"></div>
    <div id="page-missing" class="page page-content"></div>
    <div id="page-repeats" class="page page-content"></div>
    <div id="page-trade" class="page page-content"></div>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <a class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">
      <span class="material-symbols-outlined">dashboard</span>
      <span>Inicio</span>
    </a>
    <a class="nav-item" data-page="missing" onclick="navigate('missing')">
      <span class="material-symbols-outlined">inventory_2</span>
      <span>Faltantes</span>
    </a>
    <a class="nav-item" data-page="repeats" onclick="navigate('repeats')">
      <span class="material-symbols-outlined">filter_none</span>
      <span>Repetidas</span>
    </a>
    <a class="nav-item" data-page="trade" onclick="navigate('trade')">
      <span class="material-symbols-outlined">swap_horiz</span>
      <span>Intercambios</span>
    </a>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
